<h3>Deli</h3>
<!--Card container structure-->
<div class="container">
  <div class="col-md-4" *ngFor="let product of products">
    <div class="card mb-4" (click)="openModal(product)">
      <img ngOptimizedImage [src]="product.imageUrl" class="card-img-top" alt="{{product.productName}}">
      <div class="card-body">
        <h5 class="card-title">{{product.productName}}</h5>
        <p class="card-text">PLU: <strong>{{product.plu}}</strong></p>
      </div>
    </div>
  </div>
</div>

<!--Accordion structure-->
<div *ngFor="let cordionItem of cordionItems; let i=index">
  <button class="accordion" (click)="togglePanel(i)">{{cordionItem.title}}</button>
  <div class="panel" [ngStyle]="{ 'display': cordionItem.isOpen ? 'block' : 'none' }">
    <p>{{cordionItem.content}}</p>
  </div>
</div>


<!--Modal structure for a card(pop-up sub-window).-->
<div id="someModalId" class="modal">
  <div class="modal-content">
    <span class="close">×</span>
    <img [src]="selectedProduct?.imageUrl" class="modal-img">
    <div class="modal-text">
      <h2>{{selectedProduct?.productName}}</h2>
      <p><strong>PLU: </strong><u><strong>{{selectedProduct?.plu}}</strong></u></p>
      <p><strong>Department: </strong>{{selectedProduct?.department}}</p>
      <div class="baseline"></div>
      <div class="description" [innerHTML]="parsedDescription"></div>
    </div>
  </div>
</div>
